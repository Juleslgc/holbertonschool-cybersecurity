table inet filter {
  # Traffic destined for this machine
  chain input {
    type filter hook input priority 0;
    policy drop;

    # Allow existing connections
    ct state established,related accept

    # Accept all trafic 'lo'
    iifname "lo" accept

    # Accept TCP port 22 only from 10.200.0.2
    ip saddr 10.200.0.2 tcp dport 22 accept

    # Accept UDP port 51820
    udp dport 51820 accept

    # Accept ICMP
    ip protocol icmp accept
  }
  # Traffic crossing this machine
  chain forward {
    type filter hook forward priority 0;
    policy drop;

    iifname "wg0" accept
  }
  # Traffic generated by this machine
  chain output {
    type filter hook output priority 0;
    policy accept;
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    masquerade 
  }
}