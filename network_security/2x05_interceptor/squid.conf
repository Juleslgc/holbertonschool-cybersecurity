# Define the standard proxy listening port
http_port 3128

# Define the trusted local network by source IP
acl localnet src 10.200.0.0/24

# Define an ACL containing blocked destination domains from a file
acl blocked dstdomain "blocked_domains.txt"

# Define an ACL to match blocked file extensions in URLs (case-insensitive)
acl blocked_extensions urlpath_regex -i \.(exe|bat|ps1|msi|scr)$

# Deny requests for URLs matching the blocked file extensions
http_access deny blocked_extensions

# Deny HTTP requests to blocked domains
http_access deny blocked

# Allow clients from the trusted network
http_access allow localnet

# Deny all other clients
http_access deny all